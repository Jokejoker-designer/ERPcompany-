# Deploy runtime static docs → GitHub Pages (optional)
name: Deploy demo Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/thanh-hoai-runtime/docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/thanh-hoai-runtime/docs
      - id: deployment
        uses: actions/deploy-pages@v4
